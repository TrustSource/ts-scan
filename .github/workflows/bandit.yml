# Bandit is a security linter designed to find common security issues in Python code.
# The results of the scan will be found under the Security tab of your repository.
#
# Bandit runs directly instead of through a third-party action: the previously used
# shundor/python-bandit-scan pulled actions/upload-artifact@main (unpinned) and
# github/codeql-action/upload-sarif@v3 (Node.js 20).

# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 7 * * 2'

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install 'bandit[sarif]==1.9.4'

      # Tests are excluded: assert is pytest's assertion mechanism there (B101)
      - name: Bandit Scan
        run: bandit -r . -x ./tests -f sarif -o bandit.sarif --exit-zero

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
