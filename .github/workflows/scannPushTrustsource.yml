on:
  push:
    branches: [ main]

  pull_request:
    branches: [ main ]

jobs:
  dependencies-scan:
    name: Dependencies Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run TS-Scan
        uses: TrustSource/ts-scan-action@f1278b800254f442da90f77fb56aacf1a7810cc5 # v1
        with:
          project_name: ts-scan
          api_key: ${{ secrets.TRUSTSOURCE_API_KEY }}